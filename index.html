<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Aula 1 | Questões Introdutórias | Professor Moreira</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top left,#205bdf,transparent 40%),linear-gradient(145deg,#07154e,#152e9a 60%,#062a7b);color:#fff;font-family:system-ui,Arial,sans-serif}main{max-width:1100px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:14px;gap:12px}.brand{color:#ffe54c;font-size:clamp(16px,3vw,25px);font-weight:950;text-align:center;text-transform:uppercase}.screen{flex:1;background:rgba(10,29,100,.85);border:3px solid #fbdc3d;border-radius:24px;padding:clamp(18px,3vw,34px);box-shadow:0 16px 45px #0006}.eyebrow{font-size:clamp(15px,2.4vw,22px);color:#ffdf44;font-weight:900}.headline{font-size:clamp(28px,5vw,54px);line-height:1.13;margin:15px 0;font-weight:950}.statement{font-size:clamp(21px,3.1vw,33px);line-height:1.42;margin:18px 0 24px}.options{display:grid;gap:12px}.option{display:flex;align-items:flex-start;gap:14px;width:100%;text-align:left;background:#184fc0;color:#fff;border:2px solid #5d9cff;border-radius:15px;padding:15px 18px;font-size:clamp(19px,2.7vw,29px);font-weight:650;cursor:pointer}.option strong{color:#ffe64d;min-width:28px}.option.correct{background:#0c7c3d;border-color:#5aff9e}.option.wrong{background:#a71c31;border-color:#ff7889}.option:focus-visible,.nav button:focus-visible{outline:4px solid white}.feedback{margin-top:20px;background:#ffe34d;color:#092566;border-radius:15px;padding:17px;font-size:clamp(20px,2.7vw,28px);font-weight:800}.explain{font-size:clamp(19px,2.7vw,28px);line-height:1.42;font-weight:550;margin-top:12px}.nav{position:sticky;bottom:0;background:#09184feF;display:flex;align-items:center;justify-content:space-between;gap:9px;padding:12px 4px;border-radius:16px}.nav button{border:0;border-radius:12px;background:#ffe13c;color:#071b60;font-size:clamp(17px,2.4vw,25px);font-weight:950;padding:14px;cursor:pointer}.nav button:disabled{opacity:.35;cursor:not-allowed}.counter{font-size:clamp(15px,2vw,21px);font-weight:850;text-align:center}.cover{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh}.cover .headline{color:#ffe34d}.pill{background:#ffe34d;color:#102369;border-radius:999px;padding:12px 20px;font-weight:900;font-size:clamp(19px,2.8vw,28px)}.small{font-size:clamp(18px,2.5vw,26px);line-height:1.5}.score{font-size:clamp(40px,9vw,90px);color:#ffe34d;font-weight:950;text-align:center}.muted{opacity:.85}@media(max-width:560px){.nav button{padding:12px 9px}.screen{padding:17px}.option{padding:12px}.nav{gap:4px}}</style></head><body><main><div class="brand">CURSO DE CONTABILIDADE PROFESSOR MOREIRA</div><section id="screen" class="screen" aria-live="polite"></section><nav class="nav"><button id="prev">⬅ Voltar</button><span id="counter" class="counter"></span><button id="reset">↻ Reiniciar</button><button id="next">Avançar ➜</button></nav></main><script>
const questions=[{"banca":"FCC · TRT 21 · Contabilidade · 2003","orig":"40","statement":"O objeto da Contabilidade é","opts":["a conta.","o lançamento (registro).","o balanço patrimonial.","a demonstração do resultado do exercício.","o patrimônio."],"correct":"E","explain":"O objeto de estudo da Contabilidade é o patrimônio das entidades, composto de bens, direitos e obrigações."},{"banca":"AOCP · ISS Juiz de Fora · 2016","orig":"2","statement":"Assinale a alternativa que representa corretamente as técnicas que a contabilidade utiliza para alcançar seus objetivos.","opts":["Escrituração, planejamento, coordenação e controle do patrimônio.","Escrituração, balanços, inventários de estoques e controle do patrimônio.","Controle do patrimônio, auditoria, planejamento e orçamentos.","Auditoria, escrituração, demonstrações contábeis e análises das demonstrações contábeis.","Contabilização, auditoria, planejamento e controle do patrimônio."],"correct":"D","explain":"As quatro técnicas são escrituração, demonstrações contábeis, análise das demonstrações e auditoria."},{"banca":"FCC · TRT 21 · Contabilidade · 2003","orig":"41","statement":"O patrimônio, em Contabilidade, é definido como um conjunto de","opts":["direitos.","bens, direitos e obrigações.","direitos e obrigações.","bens, direitos, obrigações e patrimônio líquido.","recursos."],"correct":"B","explain":"Patrimônio é o conjunto de bens, direitos e obrigações. O patrimônio líquido é o valor residual dos ativos após a dedução dos passivos, e não um quarto elemento da definição."},{"banca":"IF-CE · Tecnólogo · 2016","orig":"3","statement":"O objeto da contabilidade é","opts":["o balanço patrimonial.","a conta.","o lançamento (registro).","o patrimônio.","a demonstração do resultado do exercício."],"correct":"D","explain":"Patrimônio é o objeto da ciência contábil; contas e demonstrações são instrumentos."},{"banca":"FCC · TCE PI · Auditor · 2005","orig":"37","statement":"As funções administrativa e econômica da contabilidade são, respectivamente,","opts":["apurar o resultado da entidade e prestar informações ao Fisco Federal.","elaborar as demonstrações de resultado e do fluxo de caixa das entidades.","o controle do patrimônio e a apuração do resultado das atividade das aziendas (entidades).","divulgar o lucro por ação das sociedades e elaborar as notas explicativas das demonstrações contábeis.","o controle do patrimônio de pessoas jurídicas de direito privado e a auditoria dos gastos por elas realizados."],"correct":"C","explain":"Função administrativa: controlar o patrimônio. Função econômica: apurar o resultado (lucro ou prejuízo). A ordem é fundamental."},{"banca":"VUNESP · IPSMI · 2016","orig":"4","statement":"A Contabilidade possui objeto próprio e consiste em conhecimentos obtidos por metodologia racional, com as condições de generalidade, certeza e busca das causas, em nível qualitativo semelhante às demais ciências sociais. Faz parte desse objeto próprio","opts":["as obrigações dos donos da empresa.","os direitos das entidades.","a obtenção de lucros e dividendos.","o patrimônio das entidades.","o equilíbrio entre receita e despesa."],"correct":"D","explain":"A ciência contábil estuda o patrimônio em seu conjunto, não apenas um elemento isolado."},{"banca":"FGV · ALEMA · Contador · 2013","orig":"20","statement":"Com relação aos conceitos básicos da Contabilidade Geral, relacione os tópicos a seguir.<br><br><b>1.</b> Objeto de estudo<br><b>2.</b> Campo de aplicação<br><b>3.</b> Finalidade econômica<br><b>4.</b> Usuário Externo<br><b>5.</b> Técnica Contábil<br><br>( ) Escrituração<br>( ) Fornecedor<br>( ) Entidade<br>( ) Resultado<br>( ) Patrimônio<br><br>Assinale a alternativa que apresenta a sequência correta, de cima para baixo.","opts":["1 – 3 – 2 – 4 – 5","3 – 4 – 1 – 5 – 2","2 – 1 – 4 – 5 – 3","5 – 4 – 2 – 3 – 1","1 – 2 – 4 – 3 – 5"],"correct":"D","explain":"Escrituração = técnica (5); fornecedor = usuário externo (4); entidade = campo de aplicação (2); resultado = finalidade econômica (3); patrimônio = objeto (1)."},{"banca":"CEBRASPE · PC/MA · Perito Criminal · 2018","orig":"6","statement":"De acordo com Max Weber, a moderna organização racional da empresa capitalista foi viabilizada pela contabilidade racional. Esse pensamento foi corroborado, na ciência contábil, por Vicenzo Masi, que identificou como objeto da contabilidade","opts":["as contas.","a azienda.","os réditos.","o patrimônio.","o lucro."],"correct":"D","explain":"A corrente patrimonialista, associada a Vincenzo Masi, reconhece o patrimônio como objeto."},{"banca":"FGV · Prefeitura do Recife · Finanças Públicas · 2014","orig":"18","statement":"As opções a seguir apresentam objetivos da Contabilidade, <b>à exceção de uma</b>. Assinale-a.","opts":["A medição dos recursos que determinada entidade possui.","A evidenciação dos direitos e interesses de uma entidade.","A medição das variações ocorridas nos recursos, direitos e interesses.","A administração dos recursos escassos, buscando compatibilizá-la com as necessidades da sociedade.","O fornecimento de um conjunto básico de informações a diferentes usuários."],"correct":"D","explain":"A Contabilidade mensura, evidencia e comunica informações patrimoniais. A administração dos recursos escassos é atividade de gestão, não objetivo próprio da Contabilidade."},{"banca":"CEBRASPE · TRE-BA · Técnico · 2017","orig":"8","statement":"A contabilidade tem como principal objetivo a(o)","opts":["fornecimento de informações que proporcionem aos seus mais diversos usuários — seja internos, seja externos — utilidade no processo de tomada de decisões.","elaboração de guias de recolhimento de tributos a fim de manter a entidade em conformidade com os ditames legais.","elaboração de demonstrações contábeis que atendam às finalidades específicas de determinado grupo de usuários.","avaliação da capacidade das entidades comerciais em arcar com suas obrigações financeiras.","mensuração de bens patrimoniais a fim de elaborar corretamente as demonstrações contábeis."],"correct":"A","explain":"A banca usa objetivo no sentido de fornecer informações úteis para decisões. Não se restringe a tributos nem a um usuário."},{"banca":"FGV · ALBA · Contabilidade · 2014","orig":"17","statement":"Assinale a opção que indica o <i>objeto</i> da Contabilidade.","opts":["Os ativos.","As receitas.","O patrimônio.","As demonstrações contábeis.","O balanço patrimonial."],"correct":"C","explain":"O objeto da Contabilidade é o patrimônio, não somente ativos, receitas ou demonstrações contábeis."},{"banca":"IESES · CEGÁS · Analista de Gestão · 2017","orig":"10","statement":"Em relação a ciência a contabilidade é considerada uma:","opts":["Ciência Social.","Ciência Exata.","Ciência Econômica.","Ciência Jurídica."],"correct":"A","explain":"É Ciência Social Aplicada, ainda que utilize cálculos e mensuração."},{"banca":"FGV · TCE PI · Assistente de Administração · 2021","orig":"13","statement":"Os registros de operações realizadas em uma empresa têm o objetivo de gerar informações úteis para a gestão organizacional.<br><br>Embora seja fornecida uma diversidade de informações nos relatórios contábeis, o objeto da contabilidade é o:","opts":["controle de receitas e despesas;","fluxo de caixa das entidades;","lucro das entidades;","patrimônio das entidades;","valor de mercado das entidades."],"correct":"D","explain":"O patrimônio das entidades é o objeto da Contabilidade. Lucro, fluxo de caixa e receitas/despesas são aspectos analisados pela ciência contábil."},{"banca":"FEPESE · ISS Florianópolis · 2014","orig":"11","statement":"Assinale a alternativa que apresenta a classificação da contabilidade como sendo uma ciência.","opts":["Ciência sociais","Ciências exatas","Ciências naturais","Ciências humanas","Ciências aplicadas"],"correct":"A","explain":"A classificação cobrada é Ciências Sociais, mais especificamente Ciência Social Aplicada."},{"banca":"FGV · DATAPREV · Gestão Econômico-Financeira · 2024","orig":"8","statement":"As noções básicas de contabilidade envolvem o registro, a classificação e a análise das transações financeiras de uma organização, fornecendo informações essenciais para a tomada de decisões econômicas e garantindo a transparência e a conformidade com normas contábeis. A principal função da contabilidade é","opts":["auxiliar na tomada de decisões e atender exclusivamente às exigências do governo.","registrar apenas transações financeiras de pequeno porte.","fornecer informações úteis para a tomada de decisões e registrar movimentações mensuráveis em relatórios.","ajudar as empresas a evitarem o pagamento de impostos.","gerar relatórios financeiros apenas para análise dos acionistas."],"correct":"C","explain":"A Contabilidade registra e comunica informações úteis à tomada de decisões de diversos usuários; não se limita ao governo ou aos acionistas."},{"banca":"VUNESP · Câmara de São Carlos-SP · Contador · 2013","orig":"12","statement":"A contabilidade é uma ciência social que tem como objeto o patrimônio das entidades, sejam privadas ou públicas. Nesse sentido, assinale a alternativa que define o que é um conjunto de bens, direitos e obrigações vinculados à entidade econômica, e que constitui um meio indispensável para que a entidade realize seus objetivos.","opts":["São as riquezas pelas quais a entidade gerará receitas.","São contas de natureza credoras e devedoras.","É o resultado ou a geração de riqueza da entidade.","É o Patrimônio.","São os mecanismos de geração de caixa."],"correct":"D","explain":"Patrimônio é o conjunto de bens, direitos e obrigações de uma entidade."},{"banca":"CEBRASPE · SEFAZ RN · AFRE · 2026","orig":"1","statement":"A contabilidade é conceituada como a ciência que tem por objeto","opts":["o estudo dos tributos incidentes sobre as entidades.","o registro apenas de atos administrativos.","a apuração apenas do lucro líquido.","o controle exclusivo do caixa das empresas.","o patrimônio das entidades e suas variações."],"correct":"E","explain":"O objeto é o patrimônio das entidades e suas variações. As demais alternativas restringem indevidamente a Contabilidade."},{"banca":"FUNDATEC · CAGE-RS · Contador · 2014","orig":"15","statement":"A partir da Teoria Contábil, considera-se objeto da contabilidade:","opts":["Os atos e fatos patrimoniais.","O patrimônio das entidades.","As entidades públicas e privadas.","Os atos e fatos da gestão.","As entidades empresariais e sem fins lucrativos."],"correct":"B","explain":"Não confunda objeto (patrimônio) com campo de aplicação (entidades)."},{"banca":"CEBRASPE · SEFAZ RN · AFRE · 2026","orig":"2","statement":"A principal finalidade da contabilidade é","opts":["atender exclusivamente ao fisco.","fornecer informações úteis para a tomada de decisão.","controlar apenas o patrimônio líquido.","registrar apenas operações financeiras.","calcular impostos."],"correct":"B","explain":"A finalidade principal é fornecer informações úteis para a tomada de decisões dos usuários."},{"banca":"FEPESE · ISS-Florianópolis · 2014","orig":"16","statement":"Assinale a alternativa que apresenta o objeto das ciências contábeis.","opts":["Patrimônio","Ativo e Passivo","Receitas e Despesas","Situação Líquida patrimonial","Comitê de pronunciamento contábil"],"correct":"A","explain":"O patrimônio é o objeto de estudo, e não um componente ou órgão normativo."},{"banca":"CEBRASPE · Prefeitura de Porto Velho · Contador · 2026","orig":"4","statement":"Considerando-se seu conceito, seu objeto e seus objetivos, é <b>correto</b> afirmar que a contabilidade","opts":["produz informações destinadas exclusivamente aos órgãos fiscalizadores.","tem como objeto o patrimônio das entidades e busca fornecer informações úteis para a tomada de decisões.","tem como objeto exclusivo o lucro das empresas, e os usuários da informação contábil restringem-se aos sócios.","tem como finalidade principal calcular tributos, independentemente da geração de informações gerenciais.","limita-se ao registro de operações financeiras realizadas por empresas privadas."],"correct":"B","explain":"A alternativa B reúne corretamente o objeto (patrimônio) e a finalidade (informações úteis para decisões)."},{"banca":"CEBRASPE · SEFAZ RJ · Contábil Financeira · 2025","orig":"5","statement":"A contabilidade tem adquirido importância crescente no contexto atual, impulsionada pelo crescimento das organizações, sejam elas públicas ou privadas, pela crescente complexidade de suas transações e operações e pela volatilidade e turbulência do ambiente de negócios.<br><br>A contabilidade tem como objeto<br><br><b>I</b> os acionistas.<br><b>II</b> os credores.<br><b>III</b> os <i>stakeholders</i>.<br><b>IV</b> o patrimônio das entidades.<br><br>Assinale a opção correta.","opts":["Apenas o item IV está certo.","Apenas os itens I e II estão certos.","Apenas os itens II e III estão certos.","Apenas os itens I, III e IV estão certos.","Todos os itens estão certos."],"correct":"A","explain":"Acionistas, credores e stakeholders são usuários ou interessados nas informações, mas o objeto da Contabilidade é o patrimônio (item IV)."},{"banca":"CEBRASPE · PC PE · Agente de Polícia · 2024","orig":"7","statement":"Atualmente, a corrente majoritária de pensadores da área de contabilidade a conceitua como","opts":["uma subdivisão da administração.","uma forma de arte.","uma ciência social.","uma ciência exata.","uma técnica."],"correct":"C","explain":"A Contabilidade é classificada como ciência social aplicada: estuda o patrimônio e os fenômenos relacionados às entidades."},{"banca":"CEBRASPE · ApexBrasil · Processos Contábeis · 2024","orig":"8","statement":"A ciência contábil tem múltiplas finalidades e ramos de atuação, mas, independentemente do enfoque, a contabilidade tem por objetivo fundamental","opts":["registrar, estimar, organizar e sintetizar as informações geradas pelas sociedades.","fornecer informações úteis aos usuários para a tomada de decisão.","controlar o patrimônio do ente contábil.","mensurar o resultado do empreendimento societário."],"correct":"B","explain":"O objetivo fundamental é fornecer informações úteis aos usuários para a tomada de decisão. Registro e mensuração são meios para isso."}];let slide=Number(localStorage.getItem("moreira_intro_tela")||0);const answers=JSON.parse(localStorage.getItem("moreira_intro_respostas")||"{}");const screen=document.getElementById('screen');const letters=['A','B','C','D','E'];function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function render(){localStorage.setItem("moreira_intro_tela",slide);localStorage.setItem("moreira_intro_respostas",JSON.stringify(answers));const total=questions.length+2;document.getElementById('counter').textContent=(slide+1)+' / '+total;document.getElementById('prev').disabled=slide===0;document.getElementById('next').disabled=slide===total-1;if(slide===0){screen.innerHTML='<div class="cover"><div class="pill">AULA 1 · CONTABILIDADE GERAL</div><h1 class="headline">QUESTÕES DE CONCURSOS<br>INTRODUÇÃO À CONTABILIDADE</h1><p class="small">24 questões de concursos · FCC · FGV · CEBRASPE · outras bancas</p><p class="small">Escolha uma alternativa para ver a correção comentada.</p><div class="pill">MÉTODO PROFESSOR MOREIRA</div></div>';return}if(slide===total-1){let hits=questions.filter((q,i)=>answers[i]===q.correct).length;let done=Object.keys(answers).length;screen.innerHTML='<div class="cover"><div class="pill">TREINAMENTO CONCLUÍDO</div><h1 class="headline">SEU DESEMPENHO</h1><div class="score">'+hits+' / '+questions.length+'</div><p class="small">Questões respondidas: '+done+' de '+questions.length+'</p><p class="small">'+(hits===questions.length?'Excelente! Você dominou o conteúdo!':'Continue praticando. Cada questão aumenta seu domínio da matéria!')+'</p></div>';return}let i=slide-1,q=questions[i],selected=answers[i];screen.innerHTML='<div class="eyebrow">QUESTÃO '+(i+1)+' DE '+questions.length+' · Original nº '+esc(q.orig)+'</div><div class="eyebrow">'+esc(q.banca)+'</div><div class="statement">'+q.statement+'</div><div class="options">'+q.opts.map((o,j)=>{let letter=letters[j],cls=selected?(letter===q.correct?'correct':letter===selected?'wrong':''):'';return '<button class="option '+cls+'" data-letter="'+letter+'"><strong>'+letter+')</strong><span>'+esc(o)+'</span></button>'}).join('')+'</div>'+(selected?'<div class="feedback">'+(selected===q.correct?'✅ PARABÉNS! VOCÊ ACERTOU!':'💪 NÃO DESISTA! SIGA EM FRENTE!')+'<br>GABARITO: '+q.correct+'</div><div class="explain"><b>RESOLUÇÃO — MÉTODO MOREIRA:</b> '+esc(q.explain)+'</div>':'');screen.querySelectorAll('[data-letter]').forEach(b=>b.onclick=()=>{answers[i]=b.dataset.letter;render()})}document.getElementById('prev').onclick=()=>{slide=Math.max(0,slide-1);render();window.scrollTo(0,0)};document.getElementById('next').onclick=()=>{slide=Math.min(questions.length+1,slide+1);render();window.scrollTo(0,0)};document.getElementById('reset').onclick=()=>{if(confirm('Reiniciar o treinamento e apagar as respostas?')){Object.keys(answers).forEach(k=>delete answers[k]);slide=0;render()}};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')document.getElementById('next').click();if(e.key==='ArrowLeft')document.getElementById('prev').click()});render();</script></body></html>
