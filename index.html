<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Aula 00 | Questões Introdutórias | Professor Moreira</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top left,#205bdf,transparent 40%),linear-gradient(145deg,#07154e,#152e9a 60%,#062a7b);color:#fff;font-family:system-ui,Arial,sans-serif}main{max-width:1100px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:14px;gap:12px}.brand{color:#ffe54c;font-size:clamp(16px,3vw,25px);font-weight:950;text-align:center;text-transform:uppercase}.screen{flex:1;background:rgba(10,29,100,.85);border:3px solid #fbdc3d;border-radius:24px;padding:clamp(18px,3vw,34px);box-shadow:0 16px 45px #0006}.eyebrow{font-size:clamp(15px,2.4vw,22px);color:#ffdf44;font-weight:900}.headline{font-size:clamp(28px,5vw,54px);line-height:1.13;margin:15px 0;font-weight:950}.statement{font-size:clamp(21px,3.1vw,33px);line-height:1.42;margin:18px 0 24px}.options{display:grid;gap:12px}.option{display:flex;align-items:flex-start;gap:14px;width:100%;text-align:left;background:#184fc0;color:#fff;border:2px solid #5d9cff;border-radius:15px;padding:15px 18px;font-size:clamp(19px,2.7vw,29px);font-weight:650;cursor:pointer}.option strong{color:#ffe64d;min-width:28px}.option.correct{background:#0c7c3d;border-color:#5aff9e}.option.wrong{background:#a71c31;border-color:#ff7889}.option:focus-visible,.nav button:focus-visible{outline:4px solid white}.feedback{margin-top:20px;background:#ffe34d;color:#092566;border-radius:15px;padding:17px;font-size:clamp(20px,2.7vw,28px);font-weight:800}.explain{font-size:clamp(19px,2.7vw,28px);line-height:1.42;font-weight:550;margin-top:12px;background:#0b2a80;border:2px solid #4b88ff;border-radius:15px;padding:18px}.nav{position:sticky;bottom:0;background:#09184feF;display:flex;align-items:center;justify-content:space-between;gap:9px;padding:12px 4px;border-radius:16px}.nav button{border:0;border-radius:12px;background:#ffe13c;color:#071b60;font-size:clamp(17px,2.4vw,25px);font-weight:950;padding:14px;cursor:pointer}.nav button:disabled{opacity:.35;cursor:not-allowed}.counter{font-size:clamp(15px,2vw,21px);font-weight:850;text-align:center}.cover{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh}.cover .headline{color:#ffe34d}.pill{background:#ffe34d;color:#102369;border-radius:999px;padding:12px 20px;font-weight:900;font-size:clamp(19px,2.8vw,28px)}.small{font-size:clamp(18px,2.5vw,26px);line-height:1.5}.score{font-size:clamp(40px,9vw,90px);color:#ffe34d;font-weight:950;text-align:center}.muted{opacity:.85}@media(max-width:560px){.nav button{padding:12px 9px}.screen{padding:17px}.option{padding:12px}.nav{gap:4px}}</style></head><body><main><div class="brand">CURSO DE CONTABILIDADE PROFESSOR MOREIRA</div><section id="screen" class="screen" aria-live="polite"></section><nav class="nav"><button id="prev">⬅ Voltar</button><span id="counter" class="counter"></span><button id="reset">↻ Reiniciar</button><button id="next">Avançar ➜</button></nav></main><script>
const questions=[{"banca":"FCC · TRT 21 · Contabilidade","orig":"40","statement":"O objeto da Contabilidade é","opts":["a conta.","o lançamento (registro).","o balanço patrimonial.","a demonstração do resultado do exercício.","o patrimônio."],"correct":"E","explain":"Objeto é aquilo que a ciência estuda.\n\nA Contabilidade investiga o patrimônio das entidades e as mudanças que nele ocorrem. Patrimônio é o conjunto de bens, direitos e obrigações.\n\nConta, lançamento e demonstrações são instrumentos de registro e comunicação; não constituem o objeto de estudo. Por isso, a opção que indica patrimônio é a única correta."},{"banca":"AOCP · ISS Juiz de Fora","orig":"2","statement":"Assinale a alternativa que representa corretamente as técnicas que a contabilidade utiliza para alcançar seus objetivos.","opts":["Escrituração, planejamento, coordenação e controle do patrimônio.","Escrituração, balanços, inventários de estoques e controle do patrimônio.","Controle do patrimônio, auditoria, planejamento e orçamentos.","Auditoria, escrituração, demonstrações contábeis e análises das demonstrações contábeis.","Contabilização, auditoria, planejamento e controle do patrimônio."],"correct":"D","explain":"As quatro técnicas contábeis são: escrituração, demonstrações contábeis, análise das demonstrações e auditoria.\n\nEscrituração registra os fatos; demonstrações organizam e comunicam os dados; análise interpreta indicadores e relações; auditoria examina evidências e a confiabilidade das informações.\n\nPlanejamento, coordenação, orçamento e controle são atividades relevantes da gestão, mas não substituem o conjunto clássico das quatro técnicas. A alternativa D reúne exatamente as quatro."},{"banca":"FCC · TRT 21 · Contabilidade","orig":"41","statement":"O patrimônio, em Contabilidade, é definido como um conjunto de","opts":["direitos.","bens, direitos e obrigações.","direitos e obrigações.","bens, direitos, obrigações e patrimônio líquido.","recursos."],"correct":"B","explain":"Patrimônio significa bens + direitos + obrigações.\n\nBens são recursos como máquinas e mercadorias; direitos são valores que terceiros devem à entidade, como duplicatas a receber; obrigações são dívidas, como fornecedores a pagar.\n\nPatrimônio líquido não entra como quarto componente da definição: é um conceito derivado, a ser estudado depois. Respostas que citam somente bens ou direitos deixam de fora partes essenciais."},{"banca":"IF-CE · Tecnólogo","orig":"3","statement":"O objeto da contabilidade é","opts":["o balanço patrimonial.","a conta.","o lançamento (registro).","o patrimônio.","a demonstração do resultado do exercício."],"correct":"D","explain":"Objeto da Contabilidade: patrimônio.\n\nO objeto responde à pergunta: o que a Contabilidade estuda? Ela estuda o conjunto patrimonial e seus acontecimentos.\n\nBalanço, demonstração do resultado, conta e lançamento são meios utilizados para registrar ou evidenciar informações. Não confunda o assunto estudado com os instrumentos empregados."},{"banca":"FCC · TCE PI · Auditor","orig":"37","statement":"As funções administrativa e econômica da contabilidade são, respectivamente,","opts":["apurar o resultado da entidade e prestar informações ao Fisco Federal.","elaborar as demonstrações de resultado e do fluxo de caixa das entidades.","o controle do patrimônio e a apuração do resultado das atividade das aziendas (entidades).","divulgar o lucro por ação das sociedades e elaborar as notas explicativas das demonstrações contábeis.","o controle do patrimônio de pessoas jurídicas de direito privado e a auditoria dos gastos por elas realizados."],"correct":"C","explain":"Função administrativa = controlar o patrimônio; função econômica = apurar o resultado.\n\nA primeira acompanha o que a entidade possui, tem a receber e deve, observando quantidades e valores. A segunda identifica se, em determinado período, houve lucro ou prejuízo.\n\nA palavra respectivamente obriga a manter a ordem: administrativa primeiro, econômica depois. Informações fiscais, relatórios e auditoria podem existir, mas não definem esse par de funções."},{"banca":"VUNESP · IPSMI","orig":"4","statement":"A Contabilidade possui objeto próprio e consiste em conhecimentos obtidos por metodologia racional, com as condições de generalidade, certeza e busca das causas, em nível qualitativo semelhante às demais ciências sociais. Faz parte desse objeto próprio","opts":["as obrigações dos donos da empresa.","os direitos das entidades.","a obtenção de lucros e dividendos.","o patrimônio das entidades.","o equilíbrio entre receita e despesa."],"correct":"D","explain":"Uma ciência possui objeto próprio e método de estudo.\n\nNa Contabilidade, esse objeto é o patrimônio das entidades, abrangendo bens, direitos e obrigações e suas alterações. É por isso que ela é tratada como ciência social aplicada.\n\nAs obrigações dos donos, os direitos isoladamente e a busca de dividendos não abrangem todo o patrimônio. O objeto não é somente uma parte nem uma finalidade econômica específica."},{"banca":"FGV · ALEMA · Contador","orig":"20","statement":"Com relação aos conceitos básicos da Contabilidade Geral, relacione os tópicos a seguir.<br><br><b>1.</b> Objeto de estudo<br><b>2.</b> Campo de aplicação<br><b>3.</b> Finalidade econômica<br><b>4.</b> Usuário Externo<br><b>5.</b> Técnica Contábil<br><br>( ) Escrituração<br>( ) Fornecedor<br>( ) Entidade<br>( ) Resultado<br>( ) Patrimônio<br><br>Assinale a alternativa que apresenta a sequência correta, de cima para baixo.","opts":["1 – 3 – 2 – 4 – 5","3 – 4 – 1 – 5 – 2","2 – 1 – 4 – 5 – 3","5 – 4 – 2 – 3 – 1","1 – 2 – 4 – 3 – 5"],"correct":"D","explain":"A sequência correta é 5 – 4 – 2 – 3 – 1.\n\nEscrituração é técnica contábil (5); fornecedor é usuário externo (4); entidade é o campo de aplicação (2); resultado corresponde à função/finalidade econômica (3); patrimônio é o objeto (1).\n\nUma boa estratégia é começar pelos termos mais inequívocos: patrimônio = objeto e escrituração = técnica. Depois, associe fornecedor a usuário externo e entidade ao campo de aplicação."},{"banca":"CEBRASPE · PC/MA · Perito Criminal","orig":"6","statement":"De acordo com Max Weber, a moderna organização racional da empresa capitalista foi viabilizada pela contabilidade racional. Esse pensamento foi corroborado, na ciência contábil, por Vicenzo Masi, que identificou como objeto da contabilidade","opts":["as contas.","a azienda.","os réditos.","o patrimônio.","o lucro."],"correct":"D","explain":"O patrimonialismo, associado a Vincenzo Masi, aponta o patrimônio como objeto da Contabilidade.\n\nA questão menciona uma abordagem histórica da teoria contábil. Mesmo com escolas e interpretações diferentes, a resposta pedida é patrimônio, e não a conta utilizada no registro.\n\nAzienda é a unidade econômico-administrativa; rédito e lucro se relacionam ao resultado; contas são instrumentos de escrituração. Nenhum desses substitui o patrimônio como objeto."},{"banca":"FGV · Prefeitura do Recife · Finanças Públicas","orig":"18","statement":"As opções a seguir apresentam objetivos da Contabilidade, <b>à exceção de uma</b>. Assinale-a.","opts":["A medição dos recursos que determinada entidade possui.","A evidenciação dos direitos e interesses de uma entidade.","A medição das variações ocorridas nos recursos, direitos e interesses.","A administração dos recursos escassos, buscando compatibilizá-la com as necessidades da sociedade.","O fornecimento de um conjunto básico de informações a diferentes usuários."],"correct":"D","explain":"A questão pede a EXCEÇÃO: alternativa D.\n\nMedir recursos, evidenciar direitos e interesses, acompanhar suas variações e comunicar informações são tarefas associadas à Contabilidade.\n\nAdministrar recursos escassos para compatibilizá-los com necessidades da sociedade é formulação típica do campo da Economia. Atenção: Contabilidade fornece informação para decisões, mas não se confunde com a administração dos recursos da sociedade."},{"banca":"CEBRASPE · TRE-BA · Técnico","orig":"8","statement":"A contabilidade tem como principal objetivo a(o)","opts":["fornecimento de informações que proporcionem aos seus mais diversos usuários — seja internos, seja externos — utilidade no processo de tomada de decisões.","elaboração de guias de recolhimento de tributos a fim de manter a entidade em conformidade com os ditames legais.","elaboração de demonstrações contábeis que atendam às finalidades específicas de determinado grupo de usuários.","avaliação da capacidade das entidades comerciais em arcar com suas obrigações financeiras.","mensuração de bens patrimoniais a fim de elaborar corretamente as demonstrações contábeis."],"correct":"A","explain":"A alternativa A destaca o fornecimento de informações úteis à decisão.\n\nEmbora o ensino tradicional distinga objetivo de controle patrimonial e finalidade de informação, muitas bancas empregam objetivo em sentido amplo: produzir informações confiáveis para usuários internos e externos.\n\nEmitir guias tributárias, avaliar somente capacidade de pagamento ou mensurar bens são aplicações parciais. A opção A é a mais abrangente e não restringe a informação a um grupo específico."},{"banca":"FGV · ALBA · Contabilidade","orig":"17","statement":"Assinale a opção que indica o <i>objeto</i> da Contabilidade.","opts":["Os ativos.","As receitas.","O patrimônio.","As demonstrações contábeis.","O balanço patrimonial."],"correct":"C","explain":"O objeto é o patrimônio, não uma peça contábil.\n\nA Contabilidade estuda os bens, direitos e obrigações das entidades, bem como os fenômenos que alteram essa realidade.\n\nAtivos e receitas são elementos ou aspectos específicos; balanço e demais demonstrações são relatórios. A banca quer a categoria abrangente: patrimônio."},{"banca":"IESES · CEGÁS · Analista de Gestão","orig":"10","statement":"Em relação a ciência a contabilidade é considerada uma:","opts":["Ciência Social.","Ciência Exata.","Ciência Econômica.","Ciência Jurídica."],"correct":"A","explain":"A Contabilidade é uma ciência social aplicada.\n\nEla usa números e mensurações, mas investiga fenômenos patrimoniais resultantes de atividades humanas e de organizações. Usar cálculos não transforma automaticamente uma disciplina em ciência exata.\n\nCiência econômica e ciência jurídica são áreas relacionadas, porém distintas. A classificação solicitada pela questão é ciência social."},{"banca":"FGV · TCE PI · Assistente de Administração","orig":"13","statement":"Os registros de operações realizadas em uma empresa têm o objetivo de gerar informações úteis para a gestão organizacional.<br><br>Embora seja fornecida uma diversidade de informações nos relatórios contábeis, o objeto da contabilidade é o:","opts":["controle de receitas e despesas;","fluxo de caixa das entidades;","lucro das entidades;","patrimônio das entidades;","valor de mercado das entidades."],"correct":"D","explain":"O objeto continua sendo o patrimônio das entidades.\n\nOs registros de operações são procedimentos para produzir informação útil. O objeto, por sua vez, é aquilo sobre o qual a informação é produzida: o patrimônio e suas variações.\n\nReceitas, despesas, caixa e lucro são aspectos particulares; valor de mercado é uma medida possível. Nenhum deles cobre o objeto integral da Contabilidade."},{"banca":"FEPESE · ISS Florianópolis","orig":"11","statement":"Assinale a alternativa que apresenta a classificação da contabilidade como sendo uma ciência.","opts":["Ciência sociais","Ciências exatas","Ciências naturais","Ciências humanas","Ciências aplicadas"],"correct":"A","explain":"A classificação pedida é Ciências Sociais.\n\nNa classificação usual, a Contabilidade integra as Ciências Sociais Aplicadas, porque estuda o patrimônio em entidades que realizam atividades econômicas e sociais.\n\nO uso de fórmulas e números pode induzir à resposta Ciências Exatas, mas o critério de classificação é a natureza do fenômeno estudado, e não a ferramenta matemática utilizada."},{"banca":"FGV · DATAPREV · Gestão Econômico-Financeira","orig":"8","statement":"As noções básicas de contabilidade envolvem o registro, a classificação e a análise das transações financeiras de uma organização, fornecendo informações essenciais para a tomada de decisões econômicas e garantindo a transparência e a conformidade com normas contábeis. A principal função da contabilidade é","opts":["auxiliar na tomada de decisões e atender exclusivamente às exigências do governo.","registrar apenas transações financeiras de pequeno porte.","fornecer informações úteis para a tomada de decisões e registrar movimentações mensuráveis em relatórios.","ajudar as empresas a evitarem o pagamento de impostos.","gerar relatórios financeiros apenas para análise dos acionistas."],"correct":"C","explain":"A principal função indicada é registrar e fornecer informações úteis à decisão.\n\nA Contabilidade identifica fatos patrimoniais, registra-os e apresenta informações que apoiam gestores, investidores, credores e outros interessados.\n\nAs alternativas erradas restringem a atividade a pequenas operações, apenas ao governo ou só aos acionistas, ou ainda propõem evitar impostos. A informação contábil tem finalidade muito mais ampla."},{"banca":"VUNESP · Câmara de São Carlos-SP · Contador","orig":"12","statement":"A contabilidade é uma ciência social que tem como objeto o patrimônio das entidades, sejam privadas ou públicas. Nesse sentido, assinale a alternativa que define o que é um conjunto de bens, direitos e obrigações vinculados à entidade econômica, e que constitui um meio indispensável para que a entidade realize seus objetivos.","opts":["São as riquezas pelas quais a entidade gerará receitas.","São contas de natureza credoras e devedoras.","É o resultado ou a geração de riqueza da entidade.","É o Patrimônio.","São os mecanismos de geração de caixa."],"correct":"D","explain":"A definição apresentada é a de patrimônio.\n\nO patrimônio reúne bens, direitos e obrigações vinculados a uma entidade, independentemente de ela ser pública, privada, lucrativa ou não lucrativa.\n\nRiquezas, contas, resultado e mecanismos de caixa não expressam o conjunto completo. A expressão conjunto de bens, direitos e obrigações é a pista decisiva para marcar D."},{"banca":"CEBRASPE · SEFAZ RN · AFRE","orig":"1","statement":"A contabilidade é conceituada como a ciência que tem por objeto","opts":["o estudo dos tributos incidentes sobre as entidades.","o registro apenas de atos administrativos.","a apuração apenas do lucro líquido.","o controle exclusivo do caixa das empresas.","o patrimônio das entidades e suas variações."],"correct":"E","explain":"O objeto da Contabilidade é o patrimônio e suas variações.\n\nEla não existe apenas para calcular tributos, controlar caixa ou apurar lucro. Todas essas atividades podem utilizar informações contábeis, mas representam recortes específicos.\n\nA opção E contempla o conjunto patrimonial e reconhece que ele se modifica com os fatos ocorridos na entidade. As demais usam a palavra apenas ou exclusivo para reduzir indevidamente seu alcance."},{"banca":"FUNDATEC · CAGE-RS · Contador","orig":"15","statement":"A partir da Teoria Contábil, considera-se objeto da contabilidade:","opts":["Os atos e fatos patrimoniais.","O patrimônio das entidades.","As entidades públicas e privadas.","Os atos e fatos da gestão.","As entidades empresariais e sem fins lucrativos."],"correct":"B","explain":"Objeto da Contabilidade: patrimônio das entidades.\n\nAtos e fatos da gestão podem ser acompanhados pela Contabilidade, mas o foco de estudo é a realidade patrimonial da entidade.\n\nEntidades públicas, privadas, empresariais e sem fins lucrativos pertencem ao campo de aplicação. Não confunda ONDE a ciência atua (entidades) com O QUE ela estuda (patrimônio)."},{"banca":"CEBRASPE · SEFAZ RN · AFRE","orig":"2","statement":"A principal finalidade da contabilidade é","opts":["atender exclusivamente ao fisco.","fornecer informações úteis para a tomada de decisão.","controlar apenas o patrimônio líquido.","registrar apenas operações financeiras.","calcular impostos."],"correct":"B","explain":"A finalidade central é oferecer informação útil à tomada de decisão.\n\nInformações contábeis podem orientar administradores, investidores, fornecedores, bancos e outros usuários, permitindo avaliar a posição e o desempenho da entidade.\n\nO atendimento ao fisco e a apuração de tributos são utilizações específicas; registrar movimentações é meio; controlar somente o patrimônio líquido é restrição indevida. A opção B traduz a finalidade geral."},{"banca":"FEPESE · ISS-Florianópolis","orig":"16","statement":"Assinale a alternativa que apresenta o objeto das ciências contábeis.","opts":["Patrimônio","Ativo e Passivo","Receitas e Despesas","Situação Líquida patrimonial","Comitê de pronunciamento contábil"],"correct":"A","explain":"O objeto das Ciências Contábeis é o patrimônio.\n\nPense na pergunta básica: qual realidade a Contabilidade observa, registra e explica? A resposta é o patrimônio da entidade.\n\nAtivo e passivo são categorias patrimoniais; receitas e despesas se relacionam ao resultado; situação líquida é um conceito derivado. Nenhuma dessas partes isoladas substitui o conjunto."},{"banca":"CEBRASPE · Prefeitura de Porto Velho · Contador","orig":"4","statement":"Considerando-se seu conceito, seu objeto e seus objetivos, é <b>correto</b> afirmar que a contabilidade","opts":["produz informações destinadas exclusivamente aos órgãos fiscalizadores.","tem como objeto o patrimônio das entidades e busca fornecer informações úteis para a tomada de decisões.","tem como objeto exclusivo o lucro das empresas, e os usuários da informação contábil restringem-se aos sócios.","tem como finalidade principal calcular tributos, independentemente da geração de informações gerenciais.","limita-se ao registro de operações financeiras realizadas por empresas privadas."],"correct":"B","explain":"A alternativa B reúne objeto e finalidade corretamente.\n\nObjeto: patrimônio das entidades. Finalidade: produzir informação útil para decisões. Isso se aplica a organizações públicas, privadas e sem fins lucrativos.\n\nAs demais respostas usam expressões restritivas como exclusivamente, apenas e limita-se, incompatíveis com a abrangência da ciência contábil. A Contabilidade não se reduz à tributação nem ao lucro."},{"banca":"CEBRASPE · SEFAZ RJ · Contábil Financeira","orig":"5","statement":"A contabilidade tem adquirido importância crescente no contexto atual, impulsionada pelo crescimento das organizações, sejam elas públicas ou privadas, pela crescente complexidade de suas transações e operações e pela volatilidade e turbulência do ambiente de negócios.<br><br>A contabilidade tem como objeto<br><br><b>I</b> os acionistas.<br><b>II</b> os credores.<br><b>III</b> os <i>stakeholders</i>.<br><b>IV</b> o patrimônio das entidades.<br><br>Assinale a opção correta.","opts":["Apenas o item IV está certo.","Apenas os itens I e II estão certos.","Apenas os itens II e III estão certos.","Apenas os itens I, III e IV estão certos.","Todos os itens estão certos."],"correct":"A","explain":"Somente o item IV identifica o objeto da Contabilidade.\n\nAcionistas e credores utilizam informações contábeis. Stakeholders é uma expressão ampla para partes interessadas na entidade. Nenhum desses grupos é o objeto estudado.\n\nA banca testa a diferença entre objeto e usuário: objeto = patrimônio; usuários = pessoas e organizações que consultam informações. Portanto, apenas IV está certo."},{"banca":"CEBRASPE · PC PE · Agente de Polícia","orig":"7","statement":"Atualmente, a corrente majoritária de pensadores da área de contabilidade a conceitua como","opts":["uma subdivisão da administração.","uma forma de arte.","uma ciência social.","uma ciência exata.","uma técnica."],"correct":"C","explain":"A corrente majoritária classifica a Contabilidade como ciência social.\n\nEla estuda o patrimônio de entidades e os fenômenos que resultam de decisões e relações humanas. A matemática é ferramenta importante, mas não define sua natureza científica.\n\nA Contabilidade não é simples subdivisão da Administração, nem mera técnica ou arte. A escrituração é uma técnica utilizada pela ciência contábil, e não sua classificação geral."},{"banca":"CEBRASPE · ApexBrasil · Processos Contábeis","orig":"8","statement":"A ciência contábil tem múltiplas finalidades e ramos de atuação, mas, independentemente do enfoque, a contabilidade tem por objetivo fundamental","opts":["registrar, estimar, organizar e sintetizar as informações geradas pelas sociedades.","fornecer informações úteis aos usuários para a tomada de decisão.","controlar o patrimônio do ente contábil.","mensurar o resultado do empreendimento societário."],"correct":"B","explain":"O gabarito B reflete a formulação ampla de objetivo: fornecer informações úteis aos usuários.\n\nA Contabilidade transforma fatos patrimoniais em informações compreensíveis para apoiar decisões econômicas. Registrar, organizar e mensurar são atividades necessárias, mas instrumentais.\n\nA opção C menciona o controle do patrimônio, tradicionalmente apresentado como objetivo em muitos materiais introdutórios. Nesta questão, porém, a banca pediu o objetivo fundamental e adotou a formulação informacional. É importante reconhecer ambas as abordagens sem confundir objeto (patrimônio) com finalidade (informar)."}];let slide=Number(localStorage.getItem("moreira_intro_tela_v2")||0);const answers=JSON.parse(localStorage.getItem("moreira_intro_respostas_v2")||"{}");const screen=document.getElementById('screen');const letters=['A','B','C','D','E'];function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function render(){localStorage.setItem("moreira_intro_tela_v2",slide);localStorage.setItem("moreira_intro_respostas_v2",JSON.stringify(answers));const total=questions.length+2;document.getElementById('counter').textContent=(slide+1)+' / '+total;document.getElementById('prev').disabled=slide===0;document.getElementById('next').disabled=slide===total-1;if(slide===0){screen.innerHTML='<div class="cover"><div class="pill">AULA 1 · CONTABILIDADE GERAL</div><h1 class="headline">QUESTÕES DE CONCURSOS<br>INTRODUÇÃO À CONTABILIDADE</h1><p class="small">24 questões de concursos · FCC · FGV · CEBRASPE · outras bancas</p><p class="small">Escolha uma alternativa para ver a correção comentada.</p><div class="pill">MÉTODO PROFESSOR MOREIRA</div></div>';return}if(slide===total-1){let hits=questions.filter((q,i)=>answers[i]===q.correct).length;let done=Object.keys(answers).length;screen.innerHTML='<div class="cover"><div class="pill">TREINAMENTO CONCLUÍDO</div><h1 class="headline">SEU DESEMPENHO</h1><div class="score">'+hits+' / '+questions.length+'</div><p class="small">Questões respondidas: '+done+' de '+questions.length+'</p><p class="small">'+(hits===questions.length?'Excelente! Você dominou o conteúdo!':'Continue praticando. Cada questão aumenta seu domínio da matéria!')+'</p></div>';return}let i=slide-1,q=questions[i],selected=answers[i];screen.innerHTML='<div class="eyebrow">QUESTÃO '+(i+1)+' DE '+questions.length+'</div><div class="eyebrow">'+esc(q.banca)+'</div><div class="statement">'+q.statement+'</div><div class="options">'+q.opts.map((o,j)=>{let letter=letters[j],cls=selected?(letter===q.correct?'correct':letter===selected?'wrong':''):'';return '<button class="option '+cls+'" data-letter="'+letter+'"><strong>'+letter+')</strong><span>'+esc(o)+'</span></button>'}).join('')+'</div>'+(selected?'<div class="feedback">'+(selected===q.correct?'✅ PARABÉNS! VOCÊ ACERTOU!':'💪 NÃO DESISTA! SIGA EM FRENTE!')+'<br>GABARITO: '+q.correct+'</div><div class="explain"><b>RESOLUÇÃO — MÉTODO MOREIRA:</b> '+esc(q.explain).replace(/\n\n/g,'<br><br>')+'</div>':'');screen.querySelectorAll('[data-letter]').forEach(b=>b.onclick=()=>{answers[i]=b.dataset.letter;render()})}document.getElementById('prev').onclick=()=>{slide=Math.max(0,slide-1);render();window.scrollTo(0,0)};document.getElementById('next').onclick=()=>{slide=Math.min(questions.length+1,slide+1);render();window.scrollTo(0,0)};document.getElementById('reset').onclick=()=>{if(confirm('Reiniciar o treinamento e apagar as respostas?')){Object.keys(answers).forEach(k=>delete answers[k]);slide=0;render()}};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')document.getElementById('next').click();if(e.key==='ArrowLeft')document.getElementById('prev').click()});render();</script></body></html>
